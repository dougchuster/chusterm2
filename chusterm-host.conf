# ── ADV Jurídico — proxy para juridico-nginx ──────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name adv.chuster.com.br www.adv.chuster.com.br;

    # ACME challenge: proxy para o juridico-nginx que já serve via certbot_www
    location /.well-known/acme-challenge/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── ChusteRM CRM — HTTP para ACME + redirect ──────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name crm.coimbraeruas.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot-crm;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── ADV Jurídico — HTTPS (proxy para juridico-nginx interno) ──────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name adv.chuster.com.br www.adv.chuster.com.br;

    ssl_certificate     /etc/letsencrypt/live/adv.chuster.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/adv.chuster.com.br/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 50m;

    location / {
        proxy_pass             https://127.0.0.1:8443;
        proxy_ssl_verify       off;
        proxy_http_version     1.1;
        proxy_set_header       Host              $host;
        proxy_set_header       X-Real-IP         $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto https;
        proxy_read_timeout     120s;
        proxy_send_timeout     120s;
        proxy_connect_timeout  10s;
    }
}

# ── ChusteRM CRM — HTTPS ──────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name crm.coimbraeruas.com.br;

    ssl_certificate     /etc/letsencrypt/live/crm.coimbraeruas.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm.coimbraeruas.com.br/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:CRM:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;

    client_max_body_size 100m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;

    # ActionCable WebSocket
    location /cable {
        proxy_pass         http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Credenciais da Evolution nunca podem ser entregues ao navegador.
    # Mantemos a rota explicitamente indisponível para neutralizar cópias
    # residuais do antigo script de auto-login em /var/www.
    location = /evo-autologin.js {
        return 404;
    }

    # O Manager e seus assets ficam disponíveis somente pela porta loopback
    # 8085, acessada por túnel SSH. A chave global nunca vai ao navegador pela
    # URL pública do CRM.
    location = /manager {
        return 404;
    }

    location /manager/ {
        return 404;
    }

    # Alias legado do Manager também permanece fechado publicamente.
    location /evo-assets/ {
        return 404;
    }

    # A API administrativa não é pública. Serviços do CRM usam a rede Docker
    # interna; manutenção pelo host pode usar loopback ou um túnel SSH.
    location ~ ^/(instance|message|chat|group|label|webhook|settings|typebot|chatwoot|proxy|template|call|dify|openai)/ {
        allow              127.0.0.1;
        allow              ::1;
        deny               all;
        proxy_pass         http://127.0.0.1:8085;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass         http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   X-Forwarded-Port 443;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
    }
}
