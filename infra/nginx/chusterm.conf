# Nginx — ChusteRM CRM
# Domínio: crm.coimbraeruas.com.br
# VPS: 187.77.255.211
#
# Instalação (na VPS):
#   cp chusterm.conf /etc/nginx/sites-available/chusterm.conf
#   ln -s /etc/nginx/sites-available/chusterm.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# SSL com Certbot:
#   certbot --nginx -d crm.coimbraeruas.com.br

# Redirecionar HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name crm.coimbraeruas.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — ChusteRM Core (Rails)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name crm.coimbraeruas.com.br;

    # Certificados gerenciados pelo Certbot
    ssl_certificate     /etc/letsencrypt/live/crm.coimbraeruas.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm.coimbraeruas.com.br/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Segurança
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Uploads (arquivos de mídia do chat)
    client_max_body_size 100M;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # ── ActionCable / WebSocket ───────────────────────────────────────────────
    location /cable {
        proxy_pass         http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── Aplicação Rails ───────────────────────────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   X-Forwarded-Port 443;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;

        # Cache de assets estáticos
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            proxy_pass http://127.0.0.1:3010;
            expires 7d;
            add_header Cache-Control "public, immutable";
        }
    }
}
