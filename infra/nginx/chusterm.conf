# Este arquivo foi SUPERSEDEDO por chusterm-host.conf (na raiz do repositório),
# que é a configuração nginx endurecida e atualmente ativa para
# crm.coimbraeruas.com.br.
#
# Motivos da desativação:
#   1. A versão antiga deste arquivo expunha publicamente o Evolution Manager
#      (/manager) e a API administrativa da Evolution via `location /`.
#   2. O location aninhado de assets estáticos declarava seu próprio
#      `add_header`, o que — pela regra de herança do nginx — REMOVIA os
#      headers de segurança do nível server (HSTS, X-Frame-Options, nosniff)
#      das respostas com extensão, incluindo blobs do Active Storage `.svg`
#      (vetor de stored-XSS via upload de SVG).
#
# O arquivo é mantido (sem nenhum server block ativo) apenas para não quebrar
# referências históricas. NÃO instale este arquivo em sites-enabled.
#
# Instalação da configuração correta (na VPS):
#   cp chusterm-host.conf /etc/nginx/sites-available/chusterm-host.conf
#   ln -s /etc/nginx/sites-available/chusterm-host.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
# =============================================================================

# Intencionalmente sem server blocks.
