name: CI

on:
  push:
    branches: [main, develop, "release/**", "feature/**"]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ─── Auditoria de marca (fase 0) ─────────────────────────────────────────────
  brand-audit:
    name: Brand Audit (sem referências ao Chatwoot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificar referências de marca proibidas
        run: bash scripts/audit-brand.sh

      - name: Validar overlay Enterprise
        run: bash scripts/audit-enterprise.sh

  # ─── Lint de segredos ─────────────────────────────────────────────────────────
  secrets-lint:
    name: Secrets Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar .env não commitado
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "ERRO: arquivo .env encontrado no repositório!"
            exit 1
          fi
          echo "OK: .env não está rastreado."

      - name: Detectar segredos expostos
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

  # ─── Agent Orchestrator ──────────────────────────────────────────────────────
  orchestrator:
    name: Orchestrator — Test, Build & Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/orchestrator
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: services/orchestrator/package-lock.json

      - run: npm ci
      - name: Test
        run: npm test
      - name: Build and typecheck
        run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  # ─── Core Frontend ───────────────────────────────────────────────────────────
  core-frontend:
    name: Core — Frontend Test & Build
    runs-on: ubuntu-latest
    if: ${{ hashFiles('core/package.json') != '' }}
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: "10.2.0"
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: core/pnpm-lock.yaml

      - name: Install dependencies
        env:
          HUSKY: "0"
        run: pnpm install --frozen-lockfile

      - name: Lint changed JavaScript and Vue files
        shell: bash
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            BASE_SHA="$(git rev-parse HEAD^)"
          fi

          mapfile -t FILES < <(
            git diff --diff-filter=ACMR --name-only "$BASE_SHA" HEAD -- \
              ':(top,glob)core/app/**/*.js' \
              ':(top,glob)core/app/**/*.vue' |
              sed 's#^core/##'
          )

          if (( ${#FILES[@]} )); then
            pnpm exec eslint "${FILES[@]}"
          else
            echo "No changed JavaScript or Vue files to lint."
          fi

      - name: Test
        run: pnpm test

      - name: Build
        env:
          SECRET_KEY_BASE: ci_dummy_secret_key_base
        run: pnpm exec vite build

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

  # ─── Core Rails (quando ./core existir) ──────────────────────────────────────
  core-ruby:
    name: Core — Security, Lint & RSpec
    runs-on: ubuntu-latest
    if: ${{ hashFiles('core/Gemfile') != '' }}
    defaults:
      run:
        working-directory: core
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: chusterm
          POSTGRES_PASSWORD: chusterm_pass
          POSTGRES_DB: chusterm_core_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.4"
          bundler-cache: true
          working-directory: core

      - name: Verify autoloading
        run: bundle exec rails zeitwerk:check

      - name: Audit Ruby dependencies
        run: bundle exec bundler-audit check

      - name: Static security analysis
        run: >-
          bundle exec brakeman --no-pager -q
          -i config/brakeman.ignore
          --ensure-ignore-notes
          --ensure-no-obsolete-ignore-entries

      - name: RuboCop
        run: bundle exec rubocop --parallel

      - name: RSpec
        env:
          RAILS_ENV: test
          DATABASE_URL: postgresql://chusterm:chusterm_pass@localhost:5432/chusterm_core_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY_BASE: test_secret_key_base_placeholder
        run: bundle exec rspec --format progress

