# Docker Compose — ChusteRM Produção
# Domínio: crm.coimbraeruas.com.br
# Acesso ao VPS: ver gerenciador de senhas do time (nunca documentar aqui — SEC-06)
#
# Uso: docker compose -f docker-compose.prod.yml up -d --build
# Migrations: docker compose -f docker-compose.prod.yml run --rm migrate
#   (o deploy.sh já faz isso antes do up — BUG-10)
#
# Diferenças do compose de dev:
#   - Sem mailhog, sem core-vite (hot-reload)
#   - Node.js services usam target: production
#   - Postgres e Redis NÃO expostos ao host
#   - Core e Evolution API acessíveis apenas via 127.0.0.1 (Nginx faz proxy)
#   - Rede isolada chusterm_network (coexiste com outros sistemas no VPS)

# PERF-08: rotação de logs em todos os serviços (json-file cresce sem limite)
x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:

  # ─── PostgreSQL ──────────────────────────────────────────────────────────────
  # F19: cap_drop/security_opt NÃO aplicados aqui — o entrypoint da imagem
  # postgres faz bootstrap como root (chown do datadir, su gosu) e quebraria.
  postgres:
    image: pgvector/pgvector:pg15
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chusterm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: chusterm_core
      POSTGRES_MULTIPLE_DATABASES: chusterm_ai,evolution_api
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/docker/postgres-init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    networks:
      - chusterm_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chusterm} -d chusterm_core"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis ───────────────────────────────────────────────────────────────────
  # F19: cap_drop/security_opt NÃO aplicados aqui — entrypoint da imagem redis
  # pode exigir caps de bootstrap; avaliar antes de endurecer.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    command: redis-server --requirepass ${REDIS_PASSWORD} --loglevel warning
    volumes:
      - redis-data:/data
    networks:
      - chusterm_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # CRM-040: os bancos legados chusterm_crm/chusterm_identity permanecem no
  # volume do Postgres para consulta histórica, mas não são mais criados em
  # instalações novas (removidos de POSTGRES_MULTIPLE_DATABASES).

  # ─── Agent Orchestrator ──────────────────────────────────────────────────────
  orchestrator:
    build:
      context: ./services/orchestrator
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    logging: *default-logging
    # F19: hardening — processo Node não precisa de capabilities nem de
    # escalar privilégio. (Sem `user:` por ora: o entrypoint da imagem pode
    # precisar de root no bootstrap — recomendado avaliar `user: "node"` ou
    # equivalente não-root em hardening futuro.)
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    networks:
      - chusterm_network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─── Evolution API (WhatsApp) ─────────────────────────────────────────────────
  # F19: cap_drop/security_opt NÃO aplicados aqui — imagem de terceiro com
  # entrypoint customizado (evolution-patch-start.sh); validar em staging
  # antes de endurecer.
  evolution-api:
    image: evoapicloud/evolution-api:v2.3.0
    restart: unless-stopped
    logging: *default-logging
    entrypoint: ["/bin/bash", "/startup/evolution-patch-start.sh"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - SERVER_URL=${EVOLUTION_SERVER_URL}
      - SERVER_PORT=8080
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://${POSTGRES_USER:-chusterm}:${POSTGRES_PASSWORD}@postgres:5432/evolution_api
      - DATABASE_CONNECTION_CLIENT_NAME=evolution_api
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=true
      - DATABASE_SAVE_DATA_MESSAGE_UPDATE=true
      - DATABASE_SAVE_DATA_CONTACTS=true
      - DATABASE_SAVE_DATA_CHATS=true
      - DATABASE_SAVE_DATA_SETTINGS=true
      - DATABASE_SAVE_IS_ON_WHATSAPP=true
      - DATABASE_SAVE_IS_ON_WHATSAPP_DAYS=7
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://:${REDIS_PASSWORD}@redis:6379/3
      - CACHE_REDIS_PREFIX_KEY=evolution
      - CACHE_LOCAL_ENABLED=false
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY}
      # Expoe o token de cada instancia em /instance/fetchInstances. Padrao
      # seguro e' false; a KVM4 roda com true desde antes do layout de
      # release. Vem do .env para que um deploy nao inverta isso em silencio.
      - AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=${EVOLUTION_EXPOSE_TOKEN_IN_FETCH:-false}
      - LOG_LEVEL=${EVOLUTION_LOG_LEVEL:-WARN}
      - DEL_INSTANCE=false
      - WEBHOOK_GLOBAL_ENABLED=false
      - CHATWOOT_ENABLED=true
      # URL do ChusteRM Core — usada pelo Patch 5 para redirecionar /manager/login
      - CHUSTERM_URL=${FRONTEND_URL:-https://crm.coimbraeruas.com.br}
    ports:
      - "127.0.0.1:8085:8080"
    volumes:
      - evolution-instances:/evolution/instances
      - evolution-store:/evolution/store
      - ./infra/evolution-patch-start.sh:/startup/evolution-patch-start.sh:ro
    networks:
      - chusterm_network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ─── Migrations (one-shot, BUG-10) ───────────────────────────────────────────
  # Roda db:migrate antes do core subir. Ativado só no deploy:
  #   docker compose -f docker-compose.prod.yml run --rm migrate
  migrate:
    image: chusterm-core:latest
    profiles: ["deploy"]
    restart: "no"
    logging: *default-logging
    # F19: hardening — rails db:migrate não precisa de capabilities.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - RAILS_ENV=production
      - NODE_ENV=production
    command: bundle exec rails db:migrate
    networks:
      - chusterm_network

  # ─── ChusteRM Core (Rails) ───────────────────────────────────────────────────
  core:
    build:
      context: ./core
      dockerfile: Dockerfile
    image: chusterm-core:latest
    restart: unless-stopped
    logging: *default-logging
    # F19: hardening — Rails serve em porta não-privilegiada (3000) e não
    # precisa de capabilities. (Sem `user:` por ora: o bootstrap da imagem
    # pode exigir root — recomendado avaliar usuário não-root no Dockerfile
    # em hardening futuro.)
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - RAILS_ENV=production
      - NODE_ENV=production
      - EVOLUTION_API_URL=http://evolution-api:8080
      - RACK_TIMEOUT_SERVICE_TIMEOUT=60
    ports:
      - "127.0.0.1:3010:3000"
    volumes:
      - core-storage:/app/storage
    command: >
      sh -c "rm -f /app/tmp/pids/server.pid &&
             bundle exec rails s -b 0.0.0.0 -p 3000"
    networks:
      - chusterm_network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # ─── Sidekiq Worker ──────────────────────────────────────────────────────────
  sidekiq:
    image: chusterm-core:latest
    restart: unless-stopped
    logging: *default-logging
    # F19: hardening — worker Sidekiq não precisa de capabilities nem de
    # escalar privilégio.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      core:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - RAILS_ENV=production
    volumes:
      - core-storage:/app/storage
    command: >
      sh -c "bundle exec sidekiq -e production -C config/sidekiq.yml"
    networks:
      - chusterm_network
    healthcheck:
      # BUG-09: sem "|| exit 0" (mascarava qualquer falha). Verifica o processo
      # sidekiq real via /proc (a imagem não tem ps/pgrep).
      test: ["CMD-SHELL", "grep -l sidekiq /proc/[0-9]*/cmdline >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  postgres-data:
  redis-data:
  evolution-instances:
  evolution-store:
  core-storage:

networks:
  chusterm_network:
    driver: bridge
    name: chusterm_network
