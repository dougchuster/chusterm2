# Modelo de documentos: JURÍDICO (escritórios de advocacia).
# Cada modelo (config/crm_documents/presets/<slug>.yml) traz o catálogo de
# tipos, a estrutura de pastas e os padrões de nome. É copiado para a conta
# na primeira vez que o cofre é usado (Crm::Documents::Defaults.ensure!) e
# depois a conta edita tudo pela tela de configurações.
#
# `target_slot` aponta para o `slot` de uma pasta (nunca para o nome), para o
# roteamento sobreviver a renomeações. Slots `processo_*` são resolvidos dentro
# da pasta do negócio. `patterns` alimenta o classificador determinístico
# (regex sem acento contra o nome do arquivo e a legenda).
name: Jurídico
description: Escritórios de advocacia — RG, CNIS, procuração, petições, decisões.

naming:
  file: '{data} — {tipo} — {descricao}'
  triage_file: '{data_hora} — {origem} — {nome_original}'
  client_folder: '{nome} · C{codigo}'
  case_folder: '{ano}-{numero} · {titulo}'

document_types:
  - { slug: rg, label: RG, target_slot: pessoais, patterns: ['\brg\b', 'identidade', 'registro geral'] }
  - { slug: cpf, label: CPF, target_slot: pessoais, patterns: ['\bcpf\b'] }
  - { slug: cnh, label: CNH, target_slot: pessoais, patterns: ['\bcnh\b', 'carteira de motorista', 'habilitacao'] }
  - { slug: certidao_nascimento, label: Certidão de Nascimento, target_slot: pessoais, validity_days: 90, patterns: ['certidao.*nascimento'] }
  - { slug: certidao_casamento, label: Certidão de Casamento, target_slot: pessoais, validity_days: 90, patterns: ['certidao.*casamento'] }
  - { slug: certidao_obito, label: Certidão de Óbito, target_slot: pessoais, validity_days: 90, patterns: ['certidao.*obito'] }
  - { slug: comprovante_residencia, label: Comprovante de Residência, target_slot: comprovantes, validity_days: 90, patterns: ['comprovante.*(residencia|endereco)', 'conta de (luz|agua|energia)'] }
  - { slug: holerite, label: Holerite, target_slot: comprovantes, patterns: ['holerite', 'contracheque', 'contra cheque'] }
  - { slug: extrato_bancario, label: Extrato Bancário, target_slot: comprovantes, patterns: ['extrato'] }
  - { slug: procuracao, label: Procuração, target_slot: contratos, patterns: ['procuracao'] }
  - { slug: contrato_honorarios, label: Contrato de Honorários, target_slot: contratos, patterns: ['contrato.*honorario'] }
  - { slug: declaracao_hipossuficiencia, label: Declaração de Hipossuficiência, target_slot: contratos, patterns: ['hipossuficiencia'] }
  - { slug: cnis, label: CNIS, target_slot: processo_docs, validity_days: 30, patterns: ['\bcnis\b'] }
  - { slug: ctps, label: CTPS, target_slot: processo_docs, patterns: ['\bctps\b', 'carteira de trabalho'] }
  - { slug: ppp, label: PPP, target_slot: processo_docs, patterns: ['\bppp\b', 'perfil profissiografico'] }
  - { slug: laudo_medico, label: Laudo Médico, target_slot: processo_docs, patterns: ['laudo', 'atestado'] }
  - { slug: peticao, label: Petição, target_slot: processo_peticoes, patterns: ['peticao', 'inicial'] }
  - { slug: decisao, label: Decisão, target_slot: processo_decisoes, patterns: ['decisao', 'sentenca', 'despacho'] }
  - { slug: outro, label: Outro, target_slot: current, patterns: [] }

# Itens de checklist (crm_checklist_templates, kind: document) → tipos que os
# atendem. Sem apelido, vale o item cuja `key` é igual ao slug do tipo. Chaves
# tiradas dos checklists reais da produção em 22/09/2026.
checklist_aliases:
  rg_cpf: [rg, cpf, cnh]
  rg_cpf_ambos: [rg, cpf, cnh]
  documento_identidade: [rg, cnh]
  contracheques: [holerite]
  holerites: [holerite]
  certidao_nascimento_filhos: [certidao_nascimento]
  certidao_nascimento_herdeiros: [certidao_nascimento]
  laudos: [laudo_medico]
  laudos_medicos: [laudo_medico]
  exames: [laudo_medico]
  carteira_trabalho: [ctps]

# Estrutura da gaveta do cliente (raiz). Prefixo numérico garante a mesma
# ordem na tela, no Windows Explorer e no Drive.
client_template:
  name: Gaveta padrão
  tree:
    - { slot: triagem, name: 00 Triagem }
    - { slot: pessoais, name: 01 Documentos Pessoais }
    - { slot: comprovantes, name: 02 Comprovantes }
    - { slot: contratos, name: 03 Procurações e Contratos }
    - { slot: processos, name: 04 Processos }
    - { slot: enviados, name: 05 Enviados pelo Escritório }
    - { slot: arquivo, name: 99 Arquivo }

# Subpastas de cada processo, por área (crm_deals.category / legal_area).
# Área sem modelo próprio usa `geral`; `case_area_aliases` cobre áreas que
# compartilham estrutura.
case_area_aliases:
  consumidor: civel
  juridico: geral

case_templates:
  geral:
    name: Processo — Geral
    tree:
      - { slot: processo_docs, name: 01 Documentos do Caso }
      - { slot: processo_peticoes, name: 02 Petições e Protocolos }
      - { slot: processo_decisoes, name: 03 Decisões e Intimações }
      - { slot: processo_comunicacoes, name: 04 Comunicações }
  previdenciario:
    name: Processo — Previdenciário
    tree:
      - { slot: processo_docs, name: 01 Documentos do Caso }
      - { slot: processo_administrativo, name: 02 Requerimento Administrativo }
      - { slot: processo_peticoes, name: 03 Petições e Protocolos }
      - { slot: processo_decisoes, name: 04 Decisões e Perícias }
  trabalhista:
    name: Processo — Trabalhista
    tree:
      - { slot: processo_docs, name: 01 Documentos do Contrato }
      - { slot: processo_provas, name: 02 Provas }
      - { slot: processo_peticoes, name: 03 Petições e Protocolos }
      - { slot: processo_decisoes, name: 04 Decisões e Audiências }
  familia:
    name: Processo — Família
    tree:
      - { slot: processo_docs, name: 01 Documentos das Partes }
      - { slot: processo_bens, name: 02 Bens e Renda }
      - { slot: processo_peticoes, name: 03 Petições e Protocolos }
      - { slot: processo_decisoes, name: 04 Decisões e Acordos }
  civel:
    name: Processo — Cível e Consumidor
    tree:
      - { slot: processo_docs, name: 01 Documentos do Caso }
      - { slot: processo_provas, name: 02 Provas }
      - { slot: processo_peticoes, name: 03 Petições e Protocolos }
      - { slot: processo_decisoes, name: 04 Decisões }
  criminal:
    name: Processo — Criminal
    tree:
      - { slot: processo_docs, name: 01 Documentos do Caso }
      - { slot: processo_provas, name: 02 Inquérito e Provas }
      - { slot: processo_peticoes, name: 03 Petições e Protocolos }
      - { slot: processo_decisoes, name: 04 Decisões e Audiências }

# Formulário inicial ao criar um formulário novo (a conta edita tudo depois).
default_form:
  name: Envio de documentos
  settings:
    intro: Preencha seus dados, conte o que aconteceu e envie os documentos pelo celular. Sem cadastro e sem aplicativo.
    success_message: Recebemos seus documentos. Guarde o número do protocolo; o escritório vai falar com você pelo WhatsApp informado.
    consent_text: Autorizo o uso destes dados e documentos exclusivamente para o meu atendimento jurídico.
    submit_label: Enviar documentos
  fields:
    - { key: nome, label: Nome completo, type: text, required: true, maps_to: contact_name }
    - { key: whatsapp, label: WhatsApp com DDD, type: phone, required: true, maps_to: contact_phone, help: É por aqui que o escritório vai responder. }
    - { key: cpf, label: CPF, type: cpf, help: Opcional. Ajuda a encontrar o seu cadastro mais rápido. }
    - { key: assunto, label: Assunto, type: radio, required: true, options: ['Aposentadoria ou benefício do INSS', 'Trabalho (demissão, direitos)', 'Família (divórcio, pensão, guarda)', 'Banco, compras ou contratos', 'Outro assunto'] }
    - { key: cliente, label: Você já é cliente do escritório?, type: radio, options: ['Sim', 'Não', 'Não sei'] }
    - { key: relato, label: Conte em poucas palavras o que aconteceu ou o que precisa, type: textarea, required: true }
    - { key: data_marcada, label: Tem alguma data marcada? (audiência, perícia, prazo), type: date }
  document_items:
    - { key: identidade, label: RG ou CNH, doc_type: rg, multiple: true }
    - { key: endereco, label: Comprovante de residência, doc_type: comprovante_residencia }
    - { key: cnis, label: CNIS, doc_type: cnis, show_if: { field: assunto, equals: 'Aposentadoria ou benefício do INSS' } }
    - { key: laudos, label: Laudos e exames médicos, doc_type: laudo_medico, multiple: true, show_if: { field: assunto, equals: 'Aposentadoria ou benefício do INSS' } }
    - { key: ctps, label: Carteira de trabalho, doc_type: ctps, multiple: true, show_if: { field: assunto, equals: 'Trabalho (demissão, direitos)' } }
    - { key: holerites, label: Últimos holerites, doc_type: holerite, multiple: true, show_if: { field: assunto, equals: 'Trabalho (demissão, direitos)' } }
    - { key: certidao_casamento, label: Certidão de casamento, doc_type: certidao_casamento, show_if: { field: assunto, equals: 'Família (divórcio, pensão, guarda)' } }
    - { key: outros, label: Outros documentos, multiple: true }
